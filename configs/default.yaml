seed: 14

corpus:
  roots: []
  ignore_dirs:
    - .git
    - .venv
    - .ssh
    - .cache
    - __pycache__
    - node_modules
  ignore_globs:
    - "*.temp"
    - "*.log"
    - "*.iso"
    - ".env*"
    - "*.pem"
    - "id_rsa*"
  max_file_size_mb: 50
  follow_symlinks: false

chunking:
  strategy: content_aware
  narrative_words: 400
  overlap: 0.2
  tabular_rows: 20

models:
  embedding: BAAI/bge-m3
  reranker: BAAI/bge-reranker-v2-m3
  device: auto
  batch_size: 32

retrieval:
  retriever: hybrid
  rerank: true
  pool_size: 30
  top_k: 5
  rrf_k: 60

llm:
  provider: none
  base_url: ""
  model: ""
  api_key_env: ""